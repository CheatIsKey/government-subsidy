# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 리뷰 설정. 병합을 막는 필수 검사는 Claude 리뷰이고, CodeRabbit은 보조 리뷰다.
# 저장소 별이 10개 미만인 동안은 PR에 `@coderabbitai review` 댓글로 리뷰를 부른다.

language: ko-KR
tone_instructions: "한국어로, 결론 먼저, 근거(파일·줄)와 고치는 예시 코드를 함께 쓴다. 칭찬과 군더더기는 뺀다."

reviews:
  profile: assertive
  auto_approvals:
    enabled: true
  high_level_summary: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^dev$"
      - "^main$"
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!gradle/wrapper/**"
    - "!gradlew"
    - "!gradlew.bat"
  path_instructions:
    - path: "**/*"
      instructions: |
        이 프로젝트는 테스트를 먼저 쓰는 TDD 규칙(CLAUDE.md)을 따른다.
        - 공공 API 서비스 키, 토큰, 비밀번호가 코드·로그·예외 메시지·테스트·문서에 실제 값으로 들어가면 반드시 지적한다.
        - 요구사항 문서(docs/cases.md, docs/decisions.md)에 없는 동작이 추가되면 지적한다.
    - path: "src/test/**"
      instructions: |
        테스트는 명세다. 테스트를 약하게 만드는 제안(단언 삭제·완화, skip, 기대값을 구현에 맞추기)은 하지 않는다.
        대신 다음을 본다: 테스트 이름이나 주석에 케이스 ID(예: OPS-5-E7)가 있는지,
        단언이 실제 버그를 잡을 만큼 구체적인지(예: contains 대신 startsWith),
        시계·시간대·타임아웃·순서에 기대어 흔들릴 수 있는지(flaky).
    - path: "src/main/**"
      instructions: |
        Spring Boot 4, Java 17 코드다. 예외 처리에서 외부 응답 본문이나 원래 예외 메시지가 그대로 밖으로 나가는지,
        동시성·트랜잭션 경계, 리소스 누수, 타임아웃 누락을 우선 본다.
    - path: "src/main/resources/db/migration/**"
      instructions: |
        Flyway 마이그레이션이다. 이미 병합된 버전 파일을 고치는 변경, 되돌릴 수 없는 데이터 삭제, 잠금이 긴 DDL을 지적한다.
    - path: ".github/workflows/**"
      instructions: |
        비밀 값이 로그에 찍히는지, 권한(permissions)이 필요 이상으로 넓은지, 외부 액션이 버전 고정 없이 쓰이는지 본다.
