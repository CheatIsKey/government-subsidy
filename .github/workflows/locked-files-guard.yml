name: Locked Files Guard

# 잠금 파일(.github/·.coderabbit/ 아래 전부, .coderabbit.yaml·.coderabbit.yml·.coderabbit.config.ts, 루트 기준·대소문자 무시)을 건드리는 PR을 막는 경비 검사.
# pull_request_target이라 PR 쪽 코드는 절대 checkout하지 않고, 기준 커밋의 스크립트만 실행한다.
on:
  pull_request_target:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: locked-files-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  locked-files:
    name: locked-files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: 잠금 파일 검사
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: exit 0
