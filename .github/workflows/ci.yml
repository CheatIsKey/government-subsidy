name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: PR 리뷰 판정 확인 스크립트 테스트 (REVIEW-GATE)
        run: bash .github/scripts/test-review-gate.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: 단위·통합 테스트
        run: ./gradlew test
